<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vice City Nights — Lamborghini Countach</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scene">

    <!-- Ciel dégradé bleu nuit / rose néon -->
    <div class="sky"></div>
    <div class="stars"></div>

    <!-- Soleil rétro synthwave -->
    <div class="sun">
      <div class="sun-stripes"></div>
    </div>

    <!-- Montagnes lointaines -->
    <svg class="mountains" viewBox="0 0 1600 300" preserveAspectRatio="none">
      <defs>
        <linearGradient id="mtnGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff2bd6" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#0a0033" stop-opacity="1"/>
        </linearGradient>
      </defs>
      <polygon points="0,300 0,180 120,90 220,160 340,60 460,150 600,80 740,170 880,70 1020,160 1160,90 1300,170 1440,80 1600,160 1600,300"
        fill="url(#mtnGrad)"/>
    </svg>

    <!-- Grille rétro futuriste qui défile -->
    <div class="grid-wrap">
      <div class="grid"></div>
      <div class="grid-fade"></div>
    </div>

    <!-- Buildings néon Art Déco (Ocean Drive) -->
    <div class="skyline">
      <div class="building b1">
        <div class="neon-sign cyan">COLONY</div>
        <div class="windows"></div>
      </div>
      <div class="building b2">
        <div class="neon-sign pink">BOULEVARD</div>
        <div class="windows"></div>
      </div>
      <div class="building b3">
        <div class="neon-sign cyan">STARLITE</div>
        <div class="windows"></div>
      </div>
      <div class="palm">
        <div class="trunk"></div>
        <div class="leaves"></div>
      </div>
    </div>

    <!-- Route + Lamborghini Countach -->
    <div class="road">
      <div class="road-lines"></div>
      <div class="car">
        <svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="55%" stop-color="#f3f5ff"/>
              <stop offset="100%" stop-color="#cdd3e8"/>
            </linearGradient>
            <linearGradient id="windowGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ff39c8"/>
              <stop offset="100%" stop-color="#06d4ff"/>
            </linearGradient>
            <linearGradient id="reflectGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#ff39c8" stop-opacity="0.8"/>
              <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
              <stop offset="100%" stop-color="#06d4ff" stop-opacity="0.8"/>
            </linearGradient>
            <radialGradient id="headlight" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="60%" stop-color="#fff7c2"/>
              <stop offset="100%" stop-color="#fff7c2" stop-opacity="0"/>
            </radialGradient>
            <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="6" result="b"/>
              <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>

          <!-- Ombre au sol -->
          <ellipse cx="300" cy="200" rx="240" ry="14" fill="#000" opacity="0.55"/>

          <!-- Châssis bas / aileron arrière -->
          <rect x="455" y="70" width="70" height="8" rx="2" fill="#ececff"/>
          <rect x="445" y="78" width="10" height="22" fill="#cdd3e8"/>
          <rect x="525" y="78" width="10" height="22" fill="#cdd3e8"/>

          <!-- Corps principal Countach (silhouette wedge) -->
          <polygon points="40,160 90,120 150,95 250,80 360,75 470,80 540,100 560,130 560,170 40,170"
            fill="url(#bodyGrad)" stroke="#9aa0bd" stroke-width="1.2"/>

          <!-- Capot avant pointu -->
          <polygon points="40,160 70,140 90,120 60,150" fill="#e7eaf6" opacity="0.9"/>

          <!-- Pare-brise et toit (très inclinés Countach) -->
          <polygon points="170,100 260,82 360,80 420,98 400,108 200,108"
            fill="url(#windowGrad)" opacity="0.92"/>
          <!-- Reflet pare-brise -->
          <polygon points="190,103 250,90 300,89 290,96 210,106" fill="#ffffff" opacity="0.25"/>

          <!-- Ligne de séparation portière -->
          <line x1="260" y1="112" x2="260" y2="160" stroke="#a4abc7" stroke-width="1.2"/>
          <!-- Prise d'air NACA caractéristique -->
          <polygon points="275,118 330,116 320,128 280,128" fill="#2a2a3d"/>

          <!-- Bandeau néon réfléchi sous la voiture -->
          <rect x="60" y="170" width="500" height="6" fill="url(#reflectGrad)" opacity="0.9" filter="url(#neonGlow)"/>

          <!-- Roues -->
          <g>
            <circle cx="140" cy="170" r="28" fill="#0a0a18"/>
            <circle cx="140" cy="170" r="18" fill="#1a1a2e" stroke="#06d4ff" stroke-width="1.5"/>
            <circle cx="140" cy="170" r="6" fill="#cdd3e8"/>
            <!-- Rayons -->
            <g stroke="#cdd3e8" stroke-width="1.2">
              <line x1="140" y1="155" x2="140" y2="185"/>
              <line x1="125" y1="170" x2="155" y2="170"/>
              <line x1="129" y1="159" x2="151" y2="181"/>
              <line x1="151" y1="159" x2="129" y2="181"/>
            </g>
          </g>
          <g>
            <circle cx="450" cy="170" r="28" fill="#0a0a18"/>
            <circle cx="450" cy="170" r="18" fill="#1a1a2e" stroke="#06d4ff" stroke-width="1.5"/>
            <circle cx="450" cy="170" r="6" fill="#cdd3e8"/>
            <g stroke="#cdd3e8" stroke-width="1.2">
              <line x1="450" y1="155" x2="450" y2="185"/>
              <line x1="435" y1="170" x2="465" y2="170"/>
              <line x1="439" y1="159" x2="461" y2="181"/>
              <line x1="461" y1="159" x2="439" y2="181"/>
            </g>
          </g>

          <!-- Phares pop-up rétractés / barre lumineuse -->
          <rect x="55" y="148" width="22" height="5" rx="1.5" fill="#ffe98a"/>
          <circle cx="50" cy="150" r="20" fill="url(#headlight)" opacity="0.85"/>

          <!-- Feux arrière néon -->
          <rect x="540" y="138" width="18" height="6" rx="2" fill="#ff39c8" filter="url(#neonGlow)"/>

          <!-- Logo lateral -->
          <text x="300" y="150" text-anchor="middle" font-family="Impact, sans-serif" font-size="14"
                fill="#ff39c8" opacity="0.85" filter="url(#neonGlow)">COUNTACH</text>
        </svg>
        <div class="car-glow"></div>
      </div>
    </div>

    <!-- Reflets / brouillard néon -->
    <div class="fog fog-pink"></div>
    <div class="fog fog-cyan"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- Titre -->
    <div class="title">
      <h1>VICE&nbsp;CITY&nbsp;NIGHTS</h1>
      <p>Miami&nbsp;·&nbsp;1986</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
