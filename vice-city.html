<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vice City Nights — Lamborghini Countach</title>
<style>
:root {
  --pink: #ff2bd6;
  --pink-soft: #ff6ee0;
  --cyan: #06d4ff;
  --cyan-soft: #7af3ff;
  --bg-deep: #050018;
  --bg-mid: #1a0040;
  --bg-pink: #4a0a55;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden; background: #000;
  font-family: "Helvetica Neue", Arial, sans-serif; color: #fff;
}
.scene { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

.sky {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 70% 25%, rgba(255,43,214,0.55) 0%, transparent 55%),
    radial-gradient(ellipse at 20% 30%, rgba(6,212,255,0.45) 0%, transparent 55%),
    linear-gradient(180deg, #050018 0%, #1a0040 35%, #4a0a55 60%, #1a0040 80%, #050018 100%);
  animation: skyShift 14s ease-in-out infinite alternate;
}
@keyframes skyShift {
  0% { filter: hue-rotate(0deg) brightness(1); }
  100% { filter: hue-rotate(15deg) brightness(1.08); }
}

.stars {
  position: absolute; inset: 0;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent 60%),
    radial-gradient(1px 1px at 28% 8%, #cfeaff, transparent 60%),
    radial-gradient(1.5px 1.5px at 45% 22%, #ffd6f6, transparent 60%),
    radial-gradient(1px 1px at 58% 6%, #fff, transparent 60%),
    radial-gradient(1.2px 1.2px at 72% 28%, #c7faff, transparent 60%),
    radial-gradient(1px 1px at 88% 12%, #fff, transparent 60%),
    radial-gradient(1px 1px at 95% 32%, #ffd6f6, transparent 60%),
    radial-gradient(1px 1px at 8% 32%, #fff, transparent 60%);
  animation: twinkle 4s ease-in-out infinite alternate;
  opacity: 0.85;
}
@keyframes twinkle { 0% { opacity: 0.45; } 100% { opacity: 0.95; } }

.sun {
  position: absolute; width: 380px; height: 380px;
  left: 50%; top: 28%; transform: translate(-50%, -50%);
  border-radius: 50%;
  background: linear-gradient(180deg, #ff2bd6 0%, #ff6ee0 35%, #06d4ff 100%);
  box-shadow: 0 0 60px rgba(255,43,214,0.7), 0 0 140px rgba(255,43,214,0.45), 0 0 220px rgba(6,212,255,0.35);
  overflow: hidden;
  animation: sunPulse 6s ease-in-out infinite;
}
@keyframes sunPulse {
  0%, 100% { box-shadow: 0 0 60px rgba(255,43,214,0.7), 0 0 140px rgba(255,43,214,0.45), 0 0 220px rgba(6,212,255,0.35); }
  50% { box-shadow: 0 0 90px rgba(255,43,214,0.9), 0 0 180px rgba(255,43,214,0.6), 0 0 260px rgba(6,212,255,0.5); }
}
.sun-stripes {
  position: absolute; inset: 0;
  background: linear-gradient(180deg,
    transparent 0%, transparent 55%,
    #050018 56%, #050018 60%, transparent 61%, transparent 67%,
    #050018 68%, #050018 71%, transparent 72%, transparent 77%,
    #050018 78%, #050018 80%, transparent 81%, transparent 86%,
    #050018 87%, #050018 89%, transparent 90%, transparent 100%);
}

.mountains {
  position: absolute; bottom: 38%; left: 0; width: 100%; height: 22vh;
  filter: drop-shadow(0 0 8px rgba(255,43,214,0.5));
}

.grid-wrap {
  position: absolute; bottom: 0; left: 0; width: 100%; height: 45%;
  perspective: 500px; overflow: hidden;
}
.grid {
  position: absolute; bottom: 0; left: -50%; width: 200%; height: 250%;
  background-image:
    linear-gradient(to right, rgba(6,212,255,0.55) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,43,214,0.55) 1px, transparent 1px);
  background-size: 60px 60px;
  transform: rotateX(60deg); transform-origin: 50% 100%;
  animation: gridMove 1.5s linear infinite;
  filter: drop-shadow(0 0 6px rgba(6,212,255,0.6));
}
@keyframes gridMove {
  from { transform: rotateX(60deg) translateY(0); }
  to { transform: rotateX(60deg) translateY(60px); }
}
.grid-fade {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(5,0,24,1) 0%, transparent 30%, transparent 100%);
  pointer-events: none;
}

.skyline {
  position: absolute; bottom: 38%; left: 0; right: 0; height: 24vh;
  display: flex; align-items: flex-end; justify-content: space-around;
  padding: 0 4vw; z-index: 2;
}
.building {
  position: relative; width: 16vw; height: 100%;
  background: linear-gradient(180deg, #0d0028 0%, #1a0040 100%);
  border: 2px solid; border-radius: 4px 4px 0 0;
}
.b1 { border-color: var(--cyan); box-shadow: 0 0 20px rgba(6,212,255,0.8), inset 0 0 30px rgba(6,212,255,0.25); height: 95%; }
.b2 { border-color: var(--pink); box-shadow: 0 0 20px rgba(255,43,214,0.8), inset 0 0 30px rgba(255,43,214,0.25); height: 75%; }
.b3 { border-color: var(--cyan); box-shadow: 0 0 20px rgba(6,212,255,0.8), inset 0 0 30px rgba(6,212,255,0.25); height: 88%; }

.windows {
  position: absolute; inset: 12% 10% 8% 10%;
  background-image:
    linear-gradient(to right, transparent 28%, rgba(255,255,255,0.18) 28%, rgba(255,255,255,0.18) 72%, transparent 72%),
    linear-gradient(to bottom, transparent 0, transparent 12%, rgba(255,110,224,0.15) 12%, rgba(255,110,224,0.15) 22%, transparent 22%);
  background-size: 20% 14%, 100% 14%;
}
.b1 .windows, .b3 .windows { box-shadow: inset 0 0 12px rgba(6,212,255,0.6); }
.b2 .windows { box-shadow: inset 0 0 12px rgba(255,43,214,0.6); }

.neon-sign {
  position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
  font-family: "Courier New", monospace; font-weight: 900;
  font-size: clamp(10px, 1.3vw, 18px); letter-spacing: 2px;
  padding: 4px 8px; border: 1.5px solid currentColor; border-radius: 3px;
  animation: flicker 4s infinite;
}
.neon-sign.cyan {
  color: var(--cyan-soft);
  text-shadow: 0 0 6px var(--cyan), 0 0 12px var(--cyan), 0 0 22px var(--cyan);
  box-shadow: 0 0 10px var(--cyan), inset 0 0 6px var(--cyan);
}
.neon-sign.pink {
  color: #ffd1f3;
  text-shadow: 0 0 6px var(--pink), 0 0 12px var(--pink), 0 0 22px var(--pink);
  box-shadow: 0 0 10px var(--pink), inset 0 0 6px var(--pink);
}
@keyframes flicker {
  0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
  20%, 24%, 55% { opacity: 0.55; }
}

.palm { position: absolute; right: 18%; bottom: 0; width: 80px; height: 60%; }
.trunk {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 8px; height: 100%;
  background: linear-gradient(180deg, #2a0a3a 0%, #0d0018 100%);
  border-radius: 4px; box-shadow: 0 0 8px rgba(255,43,214,0.5);
}
.leaves {
  position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
  width: 90px; height: 70px;
}
.leaves::before, .leaves::after {
  content: ""; position: absolute; width: 50px; height: 14px;
  background: var(--pink); border-radius: 50%;
  filter: drop-shadow(0 0 8px var(--pink)); top: 30px;
}
.leaves::before { left: -10px; transform: rotate(-30deg); }
.leaves::after { right: -10px; transform: rotate(30deg); }

.road {
  position: absolute; bottom: 0; left: 0; width: 100%; height: 38%;
  background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.6) 30%, #000 100%);
  z-index: 3;
}
.road-lines {
  position: absolute; bottom: 6%; left: 50%; transform: translateX(-50%);
  width: 70%; height: 8px;
  background: repeating-linear-gradient(to right, var(--pink) 0, var(--pink) 40px, transparent 40px, transparent 80px);
  filter: drop-shadow(0 0 6px var(--pink));
  animation: dashFlow 0.6s linear infinite;
}
@keyframes dashFlow { from { background-position: 0 0; } to { background-position: 80px 0; } }

.car {
  position: absolute; bottom: 8%; left: 50%;
  width: min(46vw, 600px); transform: translateX(-50%);
  animation: carBob 2.5s ease-in-out infinite, carDrift 9s ease-in-out infinite;
  filter: drop-shadow(0 18px 14px rgba(0,0,0,0.65))
          drop-shadow(0 0 12px rgba(255,43,214,0.55))
          drop-shadow(0 0 24px rgba(6,212,255,0.4));
}
.car svg { width: 100%; height: auto; display: block; }
@keyframes carBob {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-3px); }
}
@keyframes carDrift {
  0%, 100% { left: 50%; }
  25% { left: 53%; }
  75% { left: 47%; }
}
.car-glow {
  position: absolute; inset: auto 0 -10% 0; height: 40%;
  background: radial-gradient(ellipse at 50% 80%, rgba(255,43,214,0.55), transparent 70%);
  filter: blur(20px); z-index: -1;
}

.fog {
  position: absolute; pointer-events: none;
  filter: blur(60px); mix-blend-mode: screen; opacity: 0.55;
}
.fog-pink {
  width: 50%; height: 30%; bottom: 20%; left: -10%;
  background: radial-gradient(circle, var(--pink) 0%, transparent 70%);
  animation: fogMove1 12s ease-in-out infinite alternate;
}
.fog-cyan {
  width: 50%; height: 30%; bottom: 25%; right: -10%;
  background: radial-gradient(circle, var(--cyan) 0%, transparent 70%);
  animation: fogMove2 14s ease-in-out infinite alternate;
}
@keyframes fogMove1 {
  from { transform: translateX(0) translateY(0); }
  to { transform: translateX(20%) translateY(-10%); }
}
@keyframes fogMove2 {
  from { transform: translateX(0) translateY(0); }
  to { transform: translateX(-20%) translateY(-8%); }
}

.scanlines {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(to bottom,
    rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px,
    rgba(0,0,0,0.18) 3px, rgba(0,0,0,0) 4px);
  pointer-events: none; mix-blend-mode: multiply; opacity: 0.5; z-index: 9;
}

.vignette {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
  pointer-events: none; z-index: 8;
}

.title {
  position: absolute; top: 6%; left: 50%; transform: translateX(-50%);
  text-align: center; z-index: 10; pointer-events: none;
}
.title h1 {
  font-family: "Impact", "Arial Black", sans-serif;
  font-size: clamp(28px, 5vw, 64px); letter-spacing: 6px; color: #fff;
  background: linear-gradient(180deg, #ffffff 0%, #ff6ee0 50%, #ff2bd6 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 12px rgba(255,43,214,0.85), 0 0 24px rgba(6,212,255,0.5);
  filter: drop-shadow(0 0 10px var(--pink));
  animation: titleGlow 3s ease-in-out infinite alternate;
}
.title p {
  margin-top: 4px; font-family: "Courier New", monospace;
  letter-spacing: 8px; font-size: clamp(10px, 1.2vw, 16px);
  color: var(--cyan-soft);
  text-shadow: 0 0 8px var(--cyan), 0 0 16px var(--cyan);
}
@keyframes titleGlow {
  from { filter: drop-shadow(0 0 8px var(--pink)); }
  to { filter: drop-shadow(0 0 18px var(--pink)) drop-shadow(0 0 28px var(--cyan)); }
}

@media (max-width: 720px) {
  .sun { width: 240px; height: 240px; top: 24%; }
  .skyline { padding: 0 2vw; }
  .building { width: 22vw; }
  .palm { right: 5%; }
}
</style>
</head>
<body>
  <div class="scene">
    <div class="sky"></div>
    <div class="stars"></div>

    <div class="sun"><div class="sun-stripes"></div></div>

    <svg class="mountains" viewBox="0 0 1600 300" preserveAspectRatio="none">
      <defs>
        <linearGradient id="mtnGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff2bd6" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#0a0033" stop-opacity="1"/>
        </linearGradient>
      </defs>
      <polygon points="0,300 0,180 120,90 220,160 340,60 460,150 600,80 740,170 880,70 1020,160 1160,90 1300,170 1440,80 1600,160 1600,300" fill="url(#mtnGrad)"/>
    </svg>

    <div class="grid-wrap">
      <div class="grid"></div>
      <div class="grid-fade"></div>
    </div>

    <div class="skyline">
      <div class="building b1">
        <div class="neon-sign cyan">COLONY</div>
        <div class="windows"></div>
      </div>
      <div class="building b2">
        <div class="neon-sign pink">BOULEVARD</div>
        <div class="windows"></div>
      </div>
      <div class="building b3">
        <div class="neon-sign cyan">STARLITE</div>
        <div class="windows"></div>
      </div>
      <div class="palm">
        <div class="trunk"></div>
        <div class="leaves"></div>
      </div>
    </div>

    <div class="road">
      <div class="road-lines"></div>
      <div class="car">
        <svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="55%" stop-color="#f3f5ff"/>
              <stop offset="100%" stop-color="#cdd3e8"/>
            </linearGradient>
            <linearGradient id="windowGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ff39c8"/>
              <stop offset="100%" stop-color="#06d4ff"/>
            </linearGradient>
            <linearGradient id="reflectGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#ff39c8" stop-opacity="0.8"/>
              <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
              <stop offset="100%" stop-color="#06d4ff" stop-opacity="0.8"/>
            </linearGradient>
            <radialGradient id="headlight" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="60%" stop-color="#fff7c2"/>
              <stop offset="100%" stop-color="#fff7c2" stop-opacity="0"/>
            </radialGradient>
            <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="6" result="b"/>
              <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <ellipse cx="300" cy="200" rx="240" ry="14" fill="#000" opacity="0.55"/>
          <rect x="455" y="70" width="70" height="8" rx="2" fill="#ececff"/>
          <rect x="445" y="78" width="10" height="22" fill="#cdd3e8"/>
          <rect x="525" y="78" width="10" height="22" fill="#cdd3e8"/>
          <polygon points="40,160 90,120 150,95 250,80 360,75 470,80 540,100 560,130 560,170 40,170" fill="url(#bodyGrad)" stroke="#9aa0bd" stroke-width="1.2"/>
          <polygon points="40,160 70,140 90,120 60,150" fill="#e7eaf6" opacity="0.9"/>
          <polygon points="170,100 260,82 360,80 420,98 400,108 200,108" fill="url(#windowGrad)" opacity="0.92"/>
          <polygon points="190,103 250,90 300,89 290,96 210,106" fill="#ffffff" opacity="0.25"/>
          <line x1="260" y1="112" x2="260" y2="160" stroke="#a4abc7" stroke-width="1.2"/>
          <polygon points="275,118 330,116 320,128 280,128" fill="#2a2a3d"/>
          <rect x="60" y="170" width="500" height="6" fill="url(#reflectGrad)" opacity="0.9" filter="url(#neonGlow)"/>
          <g>
            <circle cx="140" cy="170" r="28" fill="#0a0a18"/>
            <circle cx="140" cy="170" r="18" fill="#1a1a2e" stroke="#06d4ff" stroke-width="1.5"/>
            <circle cx="140" cy="170" r="6" fill="#cdd3e8"/>
            <g stroke="#cdd3e8" stroke-width="1.2">
              <line x1="140" y1="155" x2="140" y2="185"/>
              <line x1="125" y1="170" x2="155" y2="170"/>
              <line x1="129" y1="159" x2="151" y2="181"/>
              <line x1="151" y1="159" x2="129" y2="181"/>
            </g>
          </g>
          <g>
            <circle cx="450" cy="170" r="28" fill="#0a0a18"/>
            <circle cx="450" cy="170" r="18" fill="#1a1a2e" stroke="#06d4ff" stroke-width="1.5"/>
            <circle cx="450" cy="170" r="6" fill="#cdd3e8"/>
            <g stroke="#cdd3e8" stroke-width="1.2">
              <line x1="450" y1="155" x2="450" y2="185"/>
              <line x1="435" y1="170" x2="465" y2="170"/>
              <line x1="439" y1="159" x2="461" y2="181"/>
              <line x1="461" y1="159" x2="439" y2="181"/>
            </g>
          </g>
          <rect x="55" y="148" width="22" height="5" rx="1.5" fill="#ffe98a"/>
          <circle cx="50" cy="150" r="20" fill="url(#headlight)" opacity="0.85"/>
          <rect x="540" y="138" width="18" height="6" rx="2" fill="#ff39c8" filter="url(#neonGlow)"/>
          <text x="300" y="150" text-anchor="middle" font-family="Impact, sans-serif" font-size="14" fill="#ff39c8" opacity="0.85" filter="url(#neonGlow)">COUNTACH</text>
        </svg>
        <div class="car-glow"></div>
      </div>
    </div>

    <div class="fog fog-pink"></div>
    <div class="fog fog-cyan"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div class="title">
      <h1>VICE&nbsp;CITY&nbsp;NIGHTS</h1>
      <p>Miami&nbsp;·&nbsp;1986</p>
    </div>
  </div>

<script>
(function () {
  const buildings = document.querySelectorAll(".building");
  buildings.forEach((b) => {
    const w = document.createElement("div");
    Object.assign(w.style, {
      position: "absolute", inset: "18% 14% 10% 14%",
      display: "grid", gridTemplateColumns: "repeat(4, 1fr)",
      gridTemplateRows: "repeat(8, 1fr)", gap: "4px", pointerEvents: "none"
    });
    const isPink = b.classList.contains("b2");
    const color = isPink ? "rgba(255,43,214," : "rgba(6,212,255,";
    for (let i = 0; i < 32; i++) {
      const cell = document.createElement("div");
      const lit = Math.random() > 0.45;
      const intensity = (Math.random() * 0.5 + 0.4).toFixed(2);
      cell.style.background = lit ? `${color}${intensity})` : "rgba(255,255,255,0.05)";
      cell.style.borderRadius = "1px";
      if (lit) {
        cell.style.boxShadow = `0 0 6px ${color}0.7)`;
        cell.style.animation = `winFlick ${(2 + Math.random() * 6).toFixed(2)}s infinite alternate`;
        cell.style.animationDelay = `${(Math.random() * 4).toFixed(2)}s`;
      }
      w.appendChild(cell);
    }
    b.appendChild(w);
  });

  const style = document.createElement("style");
  style.textContent = `
    @keyframes winFlick {
      0% { opacity: 0.55; }
      45% { opacity: 0.95; }
      50% { opacity: 0.4; }
      100% { opacity: 0.85; }
    }
    .shooting-star {
      position: absolute; width: 2px; height: 2px;
      background: #fff; border-radius: 50%;
      box-shadow: 0 0 8px #fff, 0 0 16px var(--cyan);
      pointer-events: none; z-index: 1;
    }
    .shooting-star::after {
      content: ""; position: absolute; top: 50%; right: 0;
      width: 80px; height: 1px;
      background: linear-gradient(to left, #fff, transparent);
      transform: translateY(-50%);
    }
  `;
  document.head.appendChild(style);

  function spawnShootingStar() {
    const s = document.createElement("div");
    s.className = "shooting-star";
    s.style.top = `${Math.random() * 25 + 5}%`;
    s.style.left = `${Math.random() * 60 + 20}%`;
    s.style.transition = "transform 1.4s linear, opacity 1.4s linear";
    s.style.opacity = "1";
    document.querySelector(".scene").appendChild(s);
    requestAnimationFrame(() => {
      s.style.transform = "translate(-280px, 120px)";
      s.style.opacity = "0";
    });
    setTimeout(() => s.remove(), 1500);
  }
  setInterval(spawnShootingStar, 3500);
  setTimeout(spawnShootingStar, 600);

  const scene = document.querySelector(".scene");
  const sun = document.querySelector(".sun");
  const mountains = document.querySelector(".mountains");
  scene.addEventListener("mousemove", (e) => {
    const x = (e.clientX / window.innerWidth - 0.5);
    const y = (e.clientY / window.innerHeight - 0.5);
    if (sun) sun.style.translate = `${x * -10}px ${y * -6}px`;
    if (mountains) mountains.style.translate = `${x * -16}px 0`;
  });
})();
</script>
</body>
</html>
